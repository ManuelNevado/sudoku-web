<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle — Central de Pasatiempos</title>
  <meta name="description" content="Adivina la palabra de 5 letras en 6 intentos. Puede estar en ingles o español.">
  <meta name="theme-color" content="#d97706">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23d97706'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>W</text></svg>">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">

  <!-- Game CSS -->
  <link rel="stylesheet" href="wordle.css">
</head>
<body>

  <!-- Site Header -->
  <header id="site-header"></header>

  <!-- Game Grid -->
  <div id="wordle-grid" class="wordle-grid"></div>

  <!-- Keyboard -->
  <div id="wordle-keyboard" class="wordle-keyboard"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal__icon" id="modal-icon">
        <i data-lucide="trophy"></i>
      </div>
      <h2 class="modal__title" id="modal-title"></h2>
      <p class="modal__message" id="modal-message"></p>
      <button class="btn btn--primary" id="modal-btn">Cerrar</button>
    </div>
  </div>

  <!-- Site Footer -->
  <footer id="site-footer"></footer>

  <!-- Shared JS -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/components.js"></script>

  <!-- Game JS -->
  <script src="words.js"></script>
  <script src="wordle.js"></script>
  <script src="wordle-ui.js"></script>
</body>
</html>
