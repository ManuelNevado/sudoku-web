<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <meta name="description" content="Juega Sudoku online gratis. Puzzles generados proceduralmente con tres niveles de dificultad.">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <h1>Sudoku</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-theme" aria-label="Cambiar tema">
        <span class="btn-icon">🌙</span>
      </button>
    </div>
  </header>

  <!-- Difficulty -->
  <nav class="difficulty-bar">
    <button class="diff-btn" data-diff="easy">Fácil</button>
    <button class="diff-btn active" data-diff="medium">Medio</button>
    <button class="diff-btn" data-diff="hard">Difícil</button>
  </nav>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-label">Errores:</span>
      <span class="stat-value" id="mistakes">0/3</span>
    </div>
    <div class="stat">
      <span class="stat-label">Tiempo:</span>
      <span class="stat-value" id="timer">00:00</span>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid-container">
    <div id="grid"></div>
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="btn-undo">
      <span class="btn-icon">✏️</span>
      Borrar
    </button>
    <button class="ctrl-btn" id="btn-notes">
      <span class="btn-icon">📝</span>
      Notas
    </button>
    <button class="ctrl-btn" id="btn-hint">
      <span class="btn-icon">💡</span>
      Pista
    </button>
    <button class="ctrl-btn" id="btn-new">
      <span class="btn-icon">🔄</span>
      Nuevo
    </button>
  </div>

  <!-- Number Pad -->
  <div class="numpad">
    <button class="num-btn" data-num="1">1</button>
    <button class="num-btn" data-num="2">2</button>
    <button class="num-btn" data-num="3">3</button>
    <button class="num-btn" data-num="4">4</button>
    <button class="num-btn" data-num="5">5</button>
    <button class="num-btn" data-num="6">6</button>
    <button class="num-btn" data-num="7">7</button>
    <button class="num-btn" data-num="8">8</button>
    <button class="num-btn" data-num="9">9</button>
    <button class="num-btn erase-btn" data-num="0">⌫</button>
  </div>

  <!-- Win/Lose Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title"></h2>
      <p id="modal-message"></p>
      <button class="modal-btn" id="modal-btn">Nuevo Juego</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    Hecho con ❤️ — <a href="https://github.com/ManuelNevado/sudoku-web" target="_blank">GitHub</a>
  </footer>

  <script src="js/sudoku.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
