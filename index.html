<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Pasatiempos</title>
  <meta name="description" content="Tu coleccion de juegos clasicos. Sudoku, y muchos mas por venir.">
  <meta name="theme-color" content="#d97706">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23d97706'/><text x='50' y='72' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>P</text></svg>">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Site Header (injected by components.js) -->
  <header id="site-header"></header>

  <!-- Hero -->
  <section class="hero">
    <h2 class="hero__title">Tu coleccion de juegos clasicos</h2>
    <p class="hero__subtitle">Elige un pasatiempo y pon a prueba tu ingenio</p>
  </section>

  <!-- Game Catalog -->
  <main class="container">
    <div class="games-grid" id="games-grid">
      <a href="games/sudoku/index.html" class="game-card">
        <div class="game-card__icon">
          <i data-lucide="grid-3x3"></i>
        </div>
        <h3 class="game-card__name">Sudoku</h3>
        <p class="game-card__desc">Rellena la cuadricula 9x9 con numeros del 1 al 9 sin repetir en filas, columnas ni bloques.</p>
      </a>
    </div>
  </main>

  <!-- Site Footer (injected by components.js) -->
  <footer id="site-footer"></footer>

  <!-- Shared JS -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>

  <!-- Home init -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Components.init('');
    });
  </script>
</body>
</html>
